<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | TechNova</title>

    <link href="./src/output.css" rel="stylesheet">
    <!-- For tab icon -->
    <link rel="icon" type="png/image" href="./images/icon.png" />
    <!-- Font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <!-- For Font Family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class=" bg-[#f8fafc] text-[#111827] dark:bg-[#0b1020] dark:text-[#f8fafc] h-min-screen">
    <!-- =============== Header Section ================ -->
    <header class=" sticky top-0 z-50 bg-white dark:bg-[#0b1020] shadow-md dark:shadow-gray-800/50">
        <div class="w-full max-w-7xl m-auto  px-4 md:px-6 lg:px-8 ">

            <div class="h-18 flex justify-between items-center">
                <!-- LOGO -->
                <div>
                    <a href="index.html">
                        <span
                            class="bg-[#4f46e5] dark:bg-[#6366f1]  py-1.5 px-3 md:px-2 md:py-1 lg:px-3 lg:py-1.5 rounded-xl text-white text-xl md:mr-1">✦</span>
                        <span class="text-xl md:text-[16px] lg:text-xl font-bold">Tech</span><span
                            class="text-[#4f46e5] dark:text-[#6366f1] text-xl md:text-[16px] lg:text-xl font-bold mr-2">Nova</span><span
                            class="text-[#9FADC0] text-[12px] md:text-[10px] lg:text-[12px] font-semibold">FEST
                            2026</span>
                    </a>
                </div>
                <!-- MENU -->
                <nav class="menu md:flex">
                    <button class="text-3xl text-[#4f46e5] cursor-pointer md:hidden pb-3" type="button" id="closeBar"><i
                            class="fa-solid fa-square-xmark"></i>
                    </button>
                    <a href="index.html"
                        class="text-[#4f46e5] dark:hover:text-[#6366f1] font-semibold  p-2 rounded-xl bg-blue-50 md:text-[12px] lg:text-[14px]">Home</a>
                    <a href="about.html"
                        class="hover:text-[#4f46e5] dark:hover:text-[#6366f1] font-semibold  p-2 rounded-xl hover:bg-blue-50 md:text-[12px] lg:text-[14px] ">About
                        Us</a>
                    <a href="events.html"
                        class="hover:text-[#4f46e5] dark:hover:text-[#6366f1] font-semibold  p-2 rounded-xl hover:bg-blue-50 md:text-[12px] lg:text-[14px]">Events</a>
                    <a href="schedule.html"
                        class="hover:text-[#4f46e5] dark:hover:text-[#6366f1] font-semibold  p-2 rounded-xl hover:bg-blue-50 md:text-[12px] lg:text-[14px]">Schedule</a>
                    <a href="gallery.html"
                        class="hover:text-[#4f46e5] dark:hover:text-[#6366f1] font-semibold  p-2 rounded-xl hover:bg-blue-50 md:text-[12px] lg:text-[14px]">Gallery</a>
                    <a href="contact.html"
                        class="hover:text-[#4f46e5] dark:hover:text-[#6366f1] font-semibold  p-2 rounded-xl hover:bg-blue-50 md:text-[12px] lg:text-[14px]">Contact</a>
                </nav>
                <!-- CTA Button -->
                <div>
                    <button class="p-1.5  cursor-pointer rounded-full  hover:bg-gray-100 dark:hover:bg-gray-800 
                         border border-gray-300 dark:border-gray-700 mr-1 md:mr-2" title="Toggle dark mode"
                        id="toggle_theme"><i class="fa-regular fa-moon"></i>
                    </button>
                    <a href="contact.html"
                        class="p-3 text-[10px] md:py-2 md:px-3 lg:py-3 lg:px-4 rounded-2xl bg-[#4f46e5] hover:bg-[#4338ca] dark:bg-[#6366f1] dark:hover:bg-[#818cf8] text-white font-bold md:text-[14px] hidden md:inline-block">Register
                        now ↗ </a>

                    <button class="p-1.5 rounded-xl dark:border-gray-700
                         border border-gray-300 md:hidden " type="button" id="bar">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                </div>
            </div>
        </div>

    </header>
    <!-- ============= Main Section ============= -->
    <main>
        <section id="hero" class="w-full h-screen"></section>


    </main>
    <!-- ============= Footer Section ============= -->
    <footer></footer>
    <!-- For Overlay (adding layer while opening the side bar) -->
    <div class="overlay"></div>
    <!-- For Scroll button -->
    <a href="#hero" class="fixed right-2.5 bottom-5 w-[50px] h-[50px] 
          flex items-center justify-center
          bg-[#4f46e5] hover:bg-[#4338ca]
          dark:bg-[#6366f1] dark:hover:bg-[#818cf8]
          text-white rounded-full hidden" id="arrow">

        <i class="fa-solid fa-arrow-up"></i>

    </a>
    <script src="./Js/script.js"></script>
</body>

</html>
